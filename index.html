```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Secret Universe ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="stars"></div>
<div id="hearts"></div>

<!-- MUSIC -->
<audio id="music" loop>
    <!-- Optional: put your music file in the repository as music.mp3 -->
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🎵 Music</button>


<!-- ================= START ================= -->

<section id="start" class="screen active">

    <div class="glass">

        <div class="moon">🌙</div>

        <p class="small-title">A little something I made for you...</p>

        <h1>Our Secret<br>Universe</h1>

        <p>
            I created a tiny universe where every star,
            every word and every heartbeat is about you. ❤️
        </p>

        <button class="main-btn" onclick="enterUniverse()">
            ✨ Enter Our Universe
        </button>

        <button class="secret-link" onclick="openSecret()">
            🔐 Do Not Open
        </button>

    </div>

</section>


<!-- ================= LOVE QUESTION ================= -->

<section id="question" class="screen">

    <div class="glass">

        <div class="heart">❤️</div>

        <p class="small-title">Before we continue...</p>

        <h1>One Question</h1>

        <h2>Do you know how much I love you?</h2>

        <div class="two-buttons">

            <button onclick="ofCourse()">
                😏 Of course!
            </button>

            <button onclick="tellMe()">
                🥺 Tell me...
            </button>

        </div>

        <div id="answer"></div>

        <button id="questionContinue"
                class="main-btn hidden"
                onclick="showUniverse()">
            🌌 Continue
        </button>

    </div>
```
